name = "beckon-relay"
main = "worker.mjs"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

# Request logs are off: the relay only ever handles ciphertext and metadata, but it has no
# reason to keep either.
[observability]
enabled = false

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

# RELAY_TOKEN is a secret: `wrangler secret put RELAY_TOKEN`, with the same value as
# BECKON_RELAY_TOKEN in ~/.beckon/env. See the README section on passwords and one-time codes.

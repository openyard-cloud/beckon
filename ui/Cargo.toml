[package]
name = "beckon-ui"
version = "0.1.0"
edition = "2021"
description = "A small UI for beckon: a menu bar app on macOS, a local web page anywhere"
license = "MIT"

[dependencies]
tiny_http = "0.12"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The menu bar app (macOS): an icon in the top bar, and a window that shows the same page.
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.27", default-features = false }
tao = { version = "0.38", default-features = false, features = ["rwh_06"] }
wry = { version = "0.58", default-features = false, features = ["os-webview"] }

      <path d="M164 219 h140 a72 72 0 0 1 72 72 v40 a72 72 0 0 1 -72 72 h-90 l-62 34 v-34 z" fill="#fff"/>
      <rect x="200" y="257" width="140" height="74" rx="37" fill="#000"/>
      <circle cx="240" cy="294" r="15" fill="#fff"/>
      <circle cx="300" cy="294" r="15" fill="#fff"/>
      <path d="M304 219 v-40" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
      <circle cx="304" cy="167" r="17" fill="#fff"/>

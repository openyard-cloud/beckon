<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>beckon</title>
<style>
:root{
  --side:#e8e8ea;--side-line:rgba(0,0,0,.09);--sel:rgba(0,0,0,.085);
  --bg:#f5f5f7;--box:#fff;--box-line:rgba(0,0,0,.08);--line:rgba(0,0,0,.08);
  --ink:#1d1d1f;--mute:#6e6e73;--faint:#a1a1a6;
  --accent:#007aff;--accent-soft:rgba(0,122,255,.12);--ok:#28a745;--warn:#c27c00;--bad:#e5342a;
  --field:#fff;--field-line:rgba(0,0,0,.14);--btn:#fff;--btn-line:rgba(0,0,0,.12);--seg-on:#fff;
  --bar:#007aff;--shadow:0 .5px 1.5px rgba(0,0,0,.12);
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --side:#252527;--side-line:rgba(255,255,255,.08);--sel:rgba(255,255,255,.1);
  --bg:#1c1c1e;--box:#2a2a2c;--box-line:rgba(255,255,255,.07);--line:rgba(255,255,255,.08);
  --ink:#f2f2f7;--mute:#98989f;--faint:#636366;
  --accent:#0a84ff;--accent-soft:rgba(10,132,255,.2);--ok:#32d74b;--warn:#ffb340;--bad:#ff5a50;
  --field:rgba(255,255,255,.06);--field-line:rgba(255,255,255,.12);--btn:rgba(255,255,255,.12);--btn-line:rgba(255,255,255,.06);--seg-on:#636366;
  --bar:#0a84ff;--shadow:0 .5px 1px rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --side:#252527;--side-line:rgba(255,255,255,.08);--sel:rgba(255,255,255,.1);
  --bg:#1c1c1e;--box:#2a2a2c;--box-line:rgba(255,255,255,.07);--line:rgba(255,255,255,.08);
  --ink:#f2f2f7;--mute:#98989f;--faint:#636366;
  --accent:#0a84ff;--accent-soft:rgba(10,132,255,.2);--ok:#32d74b;--warn:#ffb340;--bad:#ff5a50;
  --field:rgba(255,255,255,.06);--field-line:rgba(255,255,255,.12);--btn:rgba(255,255,255,.12);--btn-line:rgba(255,255,255,.06);--seg-on:#636366;
  --bar:#0a84ff;--shadow:0 .5px 1px rgba(0,0,0,.4);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-user-select:none;user-select:none;cursor:default}
input,textarea,select,pre,.sel{-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mono,pre,code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px}

/* window: sidebar + main */
#app{display:grid;grid-template-columns:216px minmax(0,1fr);height:100vh}
#side{background:var(--side);border-right:1px solid var(--side-line);display:flex;flex-direction:column;min-height:0;overflow:auto;padding:0 10px 12px}
#side .top{height:52px;flex:none}
.web #side .top{height:14px}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 10px}
.logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#f8c15a,#ef9f2c);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.logo svg{width:20px;height:20px;margin:2px 0 0 1px}
.brand b{font-size:13px;display:block}
.brand small{color:var(--mute);font-size:11px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.sec{display:flex;align-items:center;justify-content:space-between;color:var(--mute);font-size:11px;font-weight:600;padding:14px 8px 4px}
.sec button{border:0;background:none;color:var(--mute);padding:2px;border-radius:5px;display:grid;place-items:center;cursor:default}
.sec button:hover{background:var(--sel);color:var(--ink)}
.item{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;color:var(--ink);font:inherit;text-align:left;padding:5px 8px;border-radius:6px;cursor:default;margin:1px 0}
.item svg.i{color:var(--accent)}
.item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.on{background:var(--sel);font-weight:500}
.item:not(.on):hover{background:rgba(127,127,127,.08)}
.count{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;flex:none!important}
.count.bad{color:#fff;background:var(--bad);border-radius:8px;padding:0 6px;font-weight:600;line-height:16px}
.count.live{color:#fff;background:var(--ok);border-radius:8px;padding:0 6px;font-weight:600;line-height:16px}

#main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
#bar{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--bg)}
#bar h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .sub{color:var(--mute);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
#bar .t{min-width:0;display:flex;flex-direction:column}
#bar .tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
#view{flex:1;overflow:auto;padding:20px 24px 80px}
.page{max-width:980px;margin:0 auto}

/* controls */
.btn{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:6px;border:.5px solid var(--btn-line);background:var(--btn);color:var(--ink);font:inherit;box-shadow:var(--shadow);cursor:default;white-space:nowrap}
.btn:active{filter:brightness(.94)}
.btn.p{background:var(--accent);border-color:transparent;color:#fff}
.btn.d{color:var(--bad)}
.btn.dd{background:var(--bad);border-color:transparent;color:#fff}
.btn.icon{padding:0 6px}
.btn:disabled{opacity:.45}
.link{border:0;background:none;color:var(--accent);font:inherit;padding:0;cursor:pointer}
.seg{display:inline-flex;background:rgba(127,127,127,.16);border-radius:7px;padding:2px;gap:2px}
.seg button{border:0;background:none;color:var(--ink);font:inherit;padding:2px 11px;border-radius:5px;cursor:default;white-space:nowrap}
.seg button.on{background:var(--seg-on);box-shadow:0 .5px 2px rgba(0,0,0,.2);font-weight:500}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:.5px solid var(--field-line);border-radius:6px;padding:3px 7px;min-height:24px;width:100%;outline:none;box-shadow:inset 0 .5px 1px rgba(0,0,0,.04)}
input.mono,textarea.mono{font-size:12px}
input[type=checkbox]{width:auto;min-height:0;box-shadow:none;accent-color:var(--accent);margin:0}
textarea{resize:vertical;min-height:60px;line-height:1.45}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--accent)}
input.err,textarea.err{border-color:var(--bad);box-shadow:0 0 0 3px rgba(229,52,42,.15)}
input::placeholder,textarea::placeholder{color:var(--faint)}
.search{position:relative;width:200px}
.search svg{position:absolute;left:7px;top:4px;color:var(--mute)}
.search input{padding-left:26px;border-radius:7px}

/* content blocks */
h2{font-size:13px;font-weight:600;margin:24px 0 8px;display:flex;align-items:center;gap:8px}
.sub-h{font-size:12px;font-weight:600;color:var(--mute);margin:16px 0 6px;display:flex;align-items:center;gap:8px}
h2:first-child{margin-top:0}
h2 .link,h2 .btn{margin-left:auto;font-weight:400}
.box{background:var(--box);border:.5px solid var(--box-line);border-radius:10px;box-shadow:var(--shadow)}
.muted{color:var(--mute)}
.small{font-size:11px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.dot.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(40,167,69,.45)}70%{box-shadow:0 0 0 6px rgba(40,167,69,0)}100%{box-shadow:0 0 0 0 rgba(40,167,69,0)}}
.pill{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.02em;padding:0 6px;border-radius:5px;line-height:16px;background:rgba(127,127,127,.16);color:var(--mute);vertical-align:1px}
.pill.a{background:var(--accent-soft);color:var(--accent)}

/* health strip */
.strip{display:flex;flex-wrap:wrap}
.strip>div{flex:1 1 130px;padding:11px 14px;border-left:.5px solid var(--line);min-width:0}
.strip>div:first-child{border-left:0}
.strip .k{color:var(--mute);font-size:11px}
.strip .v{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px;margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.strip .s{color:var(--mute);font-size:11px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* lists (rows inside a box) */
.list>.r{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:.5px solid var(--line);min-height:44px}
.list>.r:first-child{border-top:0}
.list>.r.click:hover{background:rgba(127,127,127,.06)}
.list>.r.click:first-child:hover{border-radius:10px 10px 0 0}
.list>.r.click:last-child:hover{border-radius:0 0 10px 10px}
.list .main{flex:1;min-width:0}
.list .main>div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .meta{color:var(--mute);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .n{color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;min-width:64px}
.list .n b{color:var(--ink);font-weight:500}
.list .head{color:var(--mute);font-size:11px;min-height:30px;padding-top:6px;padding-bottom:6px}
.empty{padding:22px 12px;text-align:center;color:var(--mute)}
/* a thread's team: one row per member task, each opening to its report */
.list .crew{border-top:.5px solid var(--line);padding:4px 12px 10px 54px}
.crew .m{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;border-radius:6px}
.crew .m:hover{background:rgba(127,127,127,.06)}
.crew .m .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crew .m .n{min-width:0}
.chip{display:inline-block;font-size:10px;font-weight:600;padding:0 7px;border-radius:9px;line-height:17px;white-space:nowrap}
.chip.run{background:var(--accent-soft);color:var(--accent)}.chip.ok{background:rgba(40,167,69,.14);color:var(--ok)}.chip.bad{background:rgba(229,52,42,.14);color:var(--bad)}
.tog{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer}
.md{margin:2px 0 8px 32px;padding:10px 12px;border-radius:8px;background:rgba(127,127,127,.07);font-size:12px;line-height:1.55;word-break:break-word;max-height:420px;overflow:auto}
.md h4{margin:8px 0 4px;font-size:12px}.md p{margin:0 0 6px}.md ul{margin:0 0 6px;padding-left:18px}.md code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:rgba(127,127,127,.14);padding:0 3px;border-radius:3px}.md pre{white-space:pre-wrap;margin:0 0 6px;font-family:ui-monospace,Menlo,monospace;font-size:11px}

/* agent avatars and cards */
.av{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:11px;letter-spacing:.02em;flex:none;position:relative;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
.av.l{width:40px;height:40px;border-radius:10px;font-size:13px}
.av.s{width:24px;height:24px;border-radius:6px;font-size:9px}
.av.g{background:rgba(127,127,127,.15);color:var(--mute);box-shadow:none}
.av.f{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.av .st{position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;border:2px solid var(--box);background:var(--faint)}
.av .st.ok{background:var(--ok)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;font:inherit;color:inherit;cursor:default;min-width:0}
button.card:hover{border-color:var(--accent)}
.card .who{display:flex;gap:10px;align-items:center;min-width:0}
.card .who b{font-size:13px}
.card .who>div{min-width:0}
.card .desc{color:var(--mute);min-height:36px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .foot{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:11px;margin-top:auto;padding-top:8px;border-top:.5px solid var(--line);min-width:0}
.card .foot .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.add{align-items:center;justify-content:center;color:var(--accent);border:1px dashed var(--field-line);background:none;box-shadow:none;min-height:120px;flex-direction:row;border-radius:10px}
.card.add:hover{background:var(--accent-soft)}
.team{display:flex;gap:6px;flex-wrap:wrap}
.warn{color:var(--warn)}

/* settings groups (label left, control right) */
.group{margin-bottom:20px}
.group>.gt{font-size:13px;font-weight:600;margin:0 0 6px 2px;display:flex;align-items:center;gap:8px;min-height:24px}
.group>.gt .btn{margin-left:auto}
.srow{display:grid;grid-template-columns:minmax(150px,38%) minmax(0,1fr);gap:12px;align-items:center;padding:8px 12px;border-top:.5px solid var(--line);min-height:42px}
.srow:first-child{border-top:0}
.srow>label{font-size:13px}
.srow>label small{display:block;color:var(--mute);font-size:11px;margin-top:1px}
.srow.stack{grid-template-columns:minmax(0,1fr);gap:6px}
.srow .ctl{display:flex;align-items:center;gap:8px;min-width:0;justify-content:flex-end}
.srow .ctl select{width:auto;min-width:160px;max-width:100%}
.srow .ctl input[type=checkbox]{transform:scale(1.15)}
.danger{display:flex;justify-content:flex-end;margin-top:4px}

/* usage chart */
.chart{padding:14px 14px 8px}
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;border-bottom:.5px solid var(--line)}
.bars>div{flex:1;min-width:2px;height:100%;display:flex;align-items:flex-end}
.bars i{display:block;width:100%;background:var(--bar);border-radius:3px 3px 0 0;min-height:1px;opacity:.85}
.bars>div:hover i{opacity:1}
.axis{display:flex;justify-content:space-between;color:var(--mute);font-size:11px;margin-top:5px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 12px;border-top:.5px solid var(--line);white-space:nowrap}
tr:first-child th{border-top:0}
th{color:var(--mute);font-weight:400;font-size:11px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.t{white-space:normal;min-width:200px}

pre.log{margin:0;padding:12px 14px;white-space:pre-wrap;word-break:break-word;line-height:1.55;background:var(--box);border-radius:10px;border:.5px solid var(--box-line);min-height:300px}
.errs{color:var(--bad);margin:4px 0 0;padding-left:18px}

/* save bar and sheets */
#savebar{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;display:flex;align-items:center;gap:8px;padding:7px 8px 7px 14px;background:var(--box);border:.5px solid var(--box-line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.08);max-width:calc(100% - 32px);z-index:6}
#savebar .msg{display:flex;align-items:center;gap:6px;white-space:nowrap}
#savebar .errs{max-height:120px;overflow:auto;padding-left:0}
#savebar .errs:empty{display:none}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.18);display:flex;align-items:flex-start;justify-content:center;z-index:9}
.sheet{margin-top:64px;width:min(420px,calc(100% - 32px));background:var(--box);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.15);padding:18px}
.sheet h3{margin:0 0 6px;font-size:13px}
.sheet p{margin:0 0 6px;color:var(--mute)}
.sheet label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
.sheet .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,20px);max-width:420px;padding:8px 14px;border-radius:9px;background:rgba(40,40,42,.94);color:#fff;opacity:0;transition:.2s;pointer-events:none;z-index:10;font-size:12px}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:720px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  #side{flex-direction:row;align-items:center;overflow-x:auto;padding:6px 8px;border-right:0;border-bottom:1px solid var(--side-line);gap:2px}
  #side .top,.sec,.brand small{display:none}
  .brand{padding:0 6px 0 0}
  .item{width:auto;flex:none}
  #bar{height:auto;min-height:52px;flex-wrap:wrap;padding:8px 16px}
  #bar .tools{margin-left:0;flex-wrap:wrap}
  #view{padding:16px 16px 80px}
  .srow{grid-template-columns:minmax(0,1fr);gap:6px}
  .srow .ctl{justify-content:flex-start}
  .list .n.opt{display:none}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <section id="main">
    <header id="bar" class="drag"></header>
    <div id="view"></div>
    <div id="savebar" hidden></div>
  </section>
</div>
<div id="toast"></div>
<script>
'use strict';
// ---- access ----
const m = location.hash.match(/t=([0-9a-f]+)/);
if (m) { try { localStorage.setItem('beckonToken', m[1]); } catch {} history.replaceState(null, '', location.pathname); }
const token = m ? m[1] : (() => { try { return localStorage.getItem('beckonToken') || ''; } catch { return ''; } })();
async function api(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { Authorization: 'Bearer ' + token, ...(body ? { 'Content-Type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({ error: 'bad response' }));
  if (!r.ok) { const e = new Error(data.error || r.statusText); e.status = r.status; throw e; }
  return data;
}

// ---- in the menu bar app's window: drag it by its top strip, double-click to zoom (a browser has no ipc) ----
const native = !!(window.ipc && window.ipc.postMessage);
if (!native) document.documentElement.classList.add('web');
addEventListener('mousedown', (e) => {
  if (!native || e.button !== 0 || e.target.closest('button,input,select,textarea,a,.sel')) return;
  if (e.target.closest('.drag')) { e.preventDefault(); window.ipc.postMessage(e.detail === 2 ? 'zoom' : 'drag'); }
});

// ---- helpers ----
// replaceChildren, but flattening lists and skipping null like h() does.
const fill = (el, ...kids) => el.replaceChildren(...kids.flat(9).filter((c) => c != null && c !== false));
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(9)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const ICONS = {
  grid: '<rect x="2.5" y="2.5" width="4.6" height="4.6" rx="1.3"/><rect x="8.9" y="2.5" width="4.6" height="4.6" rx="1.3"/><rect x="2.5" y="8.9" width="4.6" height="4.6" rx="1.3"/><rect x="8.9" y="8.9" width="4.6" height="4.6" rx="1.3"/>',
  folder: '<path d="M2 4.6C2 3.7 2.7 3 3.6 3h2.6l1.5 1.6h4.7c.9 0 1.6.7 1.6 1.6v5.2c0 .9-.7 1.6-1.6 1.6H3.6c-.9 0-1.6-.7-1.6-1.6z"/>',

// A tiny markdown view for reports: text is escaped first, then headings, lists, bold and code.
function md(text) {
  const esc = (x) => x.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = (x) => esc(x).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
  const out = []; let list = false, code = null;
  for (const line of String(text ?? '').split('\n')) {
    if (code != null) { if (/^\s*```/.test(line)) { out.push('<pre>' + esc(code.join('\n')) + '</pre>'); code = null; } else code.push(line); continue; }
    if (/^\s*```/.test(line)) { if (list) { out.push('</ul>'); list = false; } code = []; continue; }
    const li = line.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if (li) { if (!list) { out.push('<ul>'); list = true; } out.push('<li>' + inline(li[1]) + '</li>'); continue; }
    if (list) { out.push('</ul>'); list = false; }
    const hd = line.match(/^#{1,6}\s+(.*)/);
    if (hd) out.push('<h4>' + inline(hd[1]) + '</h4>'); else if (line.trim()) out.push('<p>' + inline(line) + '</p>');
  }
  if (code != null) out.push('<pre>' + esc(code.join('\n')) + '</pre>');
  if (list) out.push('</ul>');
  const d = h('div', { class: 'md' }); d.innerHTML = out.join(''); return d;
}

    agents.length ? f(s, 'agent', 'Agent', null, 'select', { options: agents, blank: '(mặc định)' }) : null,
    f(s, 'channel', 'Đăng vào', 'kênh hoặc ID người nhận', 'text', { mono: true }),
    f(s, 'prompt', 'Việc cần làm', null, 'textarea', { rows: 4 })],
  h('button', { class: 'btn d', onclick: () => { cfg.schedules.splice(i, 1); redraw(); } }, 'Xoá')));
  const watches = cfg.watches.map((w, i) => [w, i]).filter(([w]) => w.project === name).map(([w, i]) => group(title('bell', w.name || w.channel || 'Watch ' + (i + 1)), [
    f(w, 'name', 'Tên'),
    f(w, 'channel', 'Kênh theo dõi', null, 'text', { mono: true, placeholder: '#myapp-alerts' }),
    f(w, 'match', 'Khớp', 'regex, không phân biệt hoa thường', 'text', { mono: true, placeholder: ':red_circle:|ERROR' }),
    f(w, 'from', 'Chỉ từ', 'tên bot hoặc ID; trống là bất kỳ ai', 'list', { mono: true, placeholder: 'bất kỳ' }),
    agents.length ? f(w, 'agent', 'Agent', null, 'select', { options: agents, blank: '(mặc định)' }) : null,
    f(w, 'cooldownMinutes', 'Nghỉ giữa hai lần', 'phút', 'number', { placeholder: '60' }),
    f(w, 'prompt', 'Việc cần làm', 'trống: chỉ điều tra', 'textarea', { rows: 3 })],
  h('button', { class: 'btn d', onclick: () => { cfg.watches.splice(i, 1); redraw(); } }, 'Xoá')));
  fill(view, h('div', { class: 'page', style: 'max-width:760px' },
    h('h2', {}, 'Lịch', h('button', { class: 'btn', onclick: () => { cfg.schedules.push({ name: '', cron: '0 8 * * 1-5', timezone: Intl.DateTimeFormat().resolvedOptions().timeZone, project: name, channel: '', prompt: '' }); redraw(); } }, icon('plus'), 'Thêm lịch')),
    sched.length ? sched : h('div', { class: 'box empty', style: 'margin-bottom:20px' }, 'Chưa có lịch. Lịch giao việc cho beckon theo giờ, như báo cáo buổi sáng.'),
    h('h2', {}, 'Watch cảnh báo', h('button', { class: 'btn', onclick: () => { cfg.watches.push({ channel: '', project: name, match: ':red_circle:' }); redraw(); } }, icon('plus'), 'Thêm watch')),
    watches.length ? watches : h('div', { class: 'box empty' }, 'Chưa có watch. Watch theo dõi một kênh cảnh báo và tự điều tra khi có tin khớp.')));
}

// ---- usage ----
let days = 14;
async function usage(my) {
  const u = await api('/api/usage?days=' + days);
  if (my !== seq) return;
  const sum = u.days.reduce((a, d) => a.map((x, i) => x + d.tokens[i]), [0, 0, 0, 0, 0]);
  const runs = u.days.reduce((a, d) => a + d.runs, 0);
  const max = Math.max(1, ...u.days.map((d) => d.tokens[1]));
  header('Usage', 'Token của các việc beckon chạy', [h('div', { class: 'seg' }, [7, 14, 30, 90].map((n) => h('button', { class: n === days ? 'on' : '', onclick: () => { days = n; render().catch(fail); } }, n + ' ngày')))]);
  const tbl = (head, rows) => h('div', { class: 'box tw' }, h('table', {}, h('tr', {}, head.map((x, i) => h('th', { class: i ? 'n' : '' }, x))), rows));
  const tokRow = (name, t) => h('tr', {}, h('td', { class: 't' }, name), h('td', { class: 'n' }, num(t[1])), h('td', { class: 'n' }, num(t[0] + t[3])), h('td', { class: 'n' }, num(t[2])), h('td', { class: 'n' }, num(t[4])));
  const head = (first) => [first, 'Output', 'Input + cache write', 'Cache read', 'Lượt trả lời'];
  fill(view, h('div', { class: 'page' },
    h('div', { class: 'box strip' },
      cell('Việc', String(runs), `${days} ngày qua`),
      cell('Output', num(sum[1]), 'Claude viết ra'),
      cell('Input', num(sum[0] + sum[3]), 'input mới và cache write'),
      cell('Cache read', num(sum[2]), 'ngữ cảnh đọc lại'),
      cell('Lượt trả lời', num(sum[4]), 'phản hồi của model')),
    h('h2', {}, 'Output mỗi ngày'),
    h('div', { class: 'box chart' },
      h('div', { class: 'bars' }, u.days.map((d) => h('div', { title: `${d.day}: ${num(d.tokens[1])} output, ${num(total(d.tokens))} tổng, ${d.runs} việc` }, h('i', { style: `height:${(d.tokens[1] / max) * 100}%` })))),
      h('div', { class: 'axis' }, h('span', {}, u.days[0]?.day), h('span', {}, 'cao nhất ' + num(max) + ' / ngày'), h('span', {}, u.days.at(-1)?.day))),
    h('h2', {}, 'Theo model'), u.models.length ? tbl(head('Model'), u.models.map((x) => tokRow(x.model, x.tokens))) : h('div', { class: 'box empty' }, 'Không có usage trong khoảng này.'),
    u.projects.length ? [h('h2', {}, 'Theo project'), tbl(head('Project'), u.projects.map((x) => tokRow(x.project, x.tokens)))] : null,
    u.top.length ? [h('h2', {}, 'Việc tốn nhiều nhất'), tbl(head('Việc'), u.top.map((x) => tokRow(`${x.project}: ${x.title}`, x.tokens)))] : null,
    h('p', { class: 'muted small' }, 'Đếm từ transcript Claude Code của các việc beckon chạy. Giới hạn gói Claude xem ở claude.ai, mục Settings > Usage.')));
}

// ---- global settings, and the raw config file ----
async function settings(my) {
  await ensureConfig();
  if (my !== seq) return;
  if (page.raw) {
    const ta = h('textarea', { class: 'mono', style: 'min-height:calc(100vh - 200px)', spellcheck: 'false', oninput: markDirty }, cfgText);
    const errBox = h('div');
    saveSource = () => ta.value;
    header('config.json', h('span', { class: 'sel' }, cfgPath), [
      h('button', { class: 'btn', onclick: async () => {
        try { const r = await api('/api/config/check', { text: ta.value }); errBox.replaceChildren(r.errors.length ? h('ul', { class: 'errs' }, r.errors.map((e) => h('li', {}, e))) : h('div', { style: 'color:var(--ok);margin-bottom:8px' }, 'Hợp lệ.')); } catch (e) { fail(e); }
      } }, 'Kiểm tra'),
      h('button', { class: 'btn p', onclick: async () => { if (await save(ta.value, errBox)) loadConfig().catch(fail); } }, 'Lưu')], () => go({ v: 'settings' }));
    fill(view, h('div', { class: 'page' }, h('p', { class: 'muted', style: 'margin-top:0' }, 'Chỉ lưu khi bước kiểm tra cấu hình của beckon đạt. beckon áp dụng ngay, không cần khởi động lại.'), errBox, ta));
    return;
  }
  const names = Object.keys(cfg.projects);
  header('Cài đặt', 'Áp dụng cho mọi project');
  fill(view, h('div', { class: 'page', style: 'max-width:760px' },
    group('Truy cập', [f(cfg, 'users', 'Ai được dùng beckon', 'ID thành viên Slack, cách nhau bằng dấu phẩy', 'list', { mono: true })]),
    names.length > 1 ? group('Project', [f(cfg, 'defaultProject', 'Project mặc định', 'cho tin nhắn riêng (DM)', 'select', { options: names, blank: '(không)' })]) : null,
    group('Giới hạn', [
      f(cfg, 'maxParallel', 'Số việc chạy cùng lúc', null, 'number', { placeholder: '3' }),
      f(cfg, 'maxHandoffs', 'Lượt agent chuyển việc liên tiếp', 'khi không có tin của người', 'number', { placeholder: '3' }),
      f(cfg, 'approvalTimeoutMinutes', 'Chờ duyệt tối đa', 'phút', 'number', { placeholder: '60' }),
      f(cfg, 'keepDays', 'Giữ worktree rảnh', 'ngày', 'number', { placeholder: '7' }),
      f(cfg, 'shutdownGraceMinutes', 'Chờ khi khởi động lại', 'phút, để việc đang chạy làm xong', 'number', { placeholder: '30' })]),
    group('Secret relay', [f(cfg, 'secretRelay', 'Cấu hình', 'JSON', 'json', { rows: 4 })]),
    group('File cấu hình', [row('config.json', h('span', { class: 'sel' }, cfgPath), h('button', { class: 'btn', onclick: () => go({ v: 'settings', raw: true }) }, icon('code'), 'Sửa trực tiếp'))])));
}

// ---- log ----
async function log(my) {
  const o = await freshOv();
  if (my !== seq) return;
  const stick = !view.querySelector('pre.log') || view.scrollTop + view.clientHeight >= view.scrollHeight - 30;
  header('Log', h('span', { class: 'sel' }, o.home + '/logs/beckon.log · 80 dòng cuối'));
  fill(view, h('div', { class: 'page', style: 'max-width:none' }, h('pre', { class: 'log' }, o.log || '(log trống)')));
  if (stick) view.scrollTop = view.scrollHeight;
}

refreshOv().then(() => render()).catch(fail);
</script>
